[project]
name = "better-rag"
version = "0.1.0"
description = "A dependency-free, local RAG engine with hybrid retrieval, citations, guardrails, and a CLI."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Fernando Garza"}]
keywords = ["rag", "retrieval", "citations", "llm", "guardrails", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/BETTER-RAG"
Repository = "https://github.com/fernandogarzaaa/BETTER-RAG"
Issues = "https://github.com/fernandogarzaaa/BETTER-RAG/issues"

[project.scripts]
better-rag = "better_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["better_rag*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the classic default rule set so newer ruff releases do not change it.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["better_rag"]
